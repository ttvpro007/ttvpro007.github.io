name: CI

# Lint, test and build only, on every branch. Atelier is the only deployer (see docs/release.md):
# master  → Atelier deploys the live site: `npm run atelier -- site deploy portfolio`
# staging → Atelier deploys the staging site: `npm run atelier -- site deploy portfolio preview`.
#           CI still builds it the way Atelier does (BASE_PATH=STAGING_BASE_PATH, SITE_ENV=staging),
#           so a base-path break shows up here before the staging deploy
# PRs     → lint, test and build
on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master]
  workflow_dispatch:

# A newer push cancels the older run for the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # CI deploys nothing; Atelier does
  packages: read   # install the @ttvpro007/loom-* packages from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: https://npm.pkg.github.com
          scope: '@ttvpro007'

      - name: Install dependencies
        run: npm ci
        env:
          # Each Loom package grants this repo Actions read access (package settings → Manage Actions access)
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ github.ref == 'refs/heads/staging' && vars.STAGING_BASE_PATH || '/' }}
          SITE_ENV: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}

