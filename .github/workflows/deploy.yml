name: CI & Deploy

# master  → lint, test, build, deploy the live site (this repo's gh-pages branch)
# staging → lint, test, build, deploy the staging site (only when STAGING_REPO is configured — see docs/release.md)
# PRs     → lint, test and build only
on:
  push:
    branches: [master, staging]
  pull_request:
    branches: [master]
  workflow_dispatch:

# One deploy per branch at a time; a newer push cancels the older run
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read   # install the @ttvpro007/loom-* packages from GitHub Packages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: https://npm.pkg.github.com
          scope: '@ttvpro007'

      - name: Install dependencies
        run: npm ci
        env:
          # Each Loom package grants this repo Actions read access (package settings → Manage Actions access)
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ github.ref == 'refs/heads/staging' && vars.STAGING_BASE_PATH || '/' }}
          SITE_ENV: ${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }}

      - name: Deploy live site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Deploy staging site
        if: github.event_name == 'push' && github.ref == 'refs/heads/staging' && vars.STAGING_REPO != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.STAGING_DEPLOY_KEY }}
          external_repository: ${{ vars.STAGING_REPO }}
          publish_branch: gh-pages
          publish_dir: ./dist
